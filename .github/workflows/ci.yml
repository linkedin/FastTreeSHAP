name: CI

on:
  push:
    # all branches (not tags) so pushes to a fork's feature branch also get CI,
    # not just the default branch
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: ruff check
        run: ruff check .

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Use bash on every OS (Git Bash on Windows) so the env-var / quoting syntax
    # in the steps below behaves the same everywhere.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The C++ extension is compiled with OpenMP. Linux runners already ship
      # libgomp with gcc; macOS/clang needs Homebrew's libomp, and the compiler
      # has to be told where to find it (setup.py builds with -Xpreprocessor
      # -fopenmp -lomp). If this step is missing, the OpenMP build fails and
      # setup.py silently falls back to *no* C extension, which breaks the tests.
      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          LIBOMP_PREFIX="$(brew --prefix libomp)"
          echo "LDFLAGS=-L${LIBOMP_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I${LIBOMP_PREFIX}/include" >> "$GITHUB_ENV"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # editable build compiles fasttreeshap._cext in place
          pip install -e .
          # the test suite only exercises fasttreeshap itself, across the tree
          # model backends it supports
          pip install pytest pytest-cov pytest-xdist matplotlib ipython lightgbm xgboost
          # catboost ships wheels broadly; if one is missing (e.g. a brand-new
          # Python) its tests simply importorskip instead of failing the build
          pip install catboost || echo "catboost unavailable here -> its tests will skip"

      - name: Run test suite
        run: >-
          pytest
          -o addopts="-n auto --cov=fasttreeshap --cov-report=xml --cov-report=term-missing --durations=20"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true
